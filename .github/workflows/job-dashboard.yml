name: COSIMA Recipes Dashboard

on:
  push:
    branches:
      - main
    paths:
      - dashboard/**
      - scripts/build_dashboard_data.py
      - .github/configs/cosima-all-recipes.*
      - .github/workflows/cosima-all-recipes.yml
      - .github/workflows/job-dashboard.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - COSIMA All Recipes
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy-dashboard:
    name: Build and deploy static dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Find all-recipes run with artifacts
        id: latest-summary
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = 'cosima-all-recipes.yml';

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id,
              status: 'completed',
              per_page: 100,
            });
            if (context.eventName === 'workflow_run') {
              runs.unshift(context.payload.workflow_run);
            }

            let selected = null;
            for (const run of runs) {
              if (run.head_branch !== 'main') continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const matches = artifacts.filter((artifact) => artifact.name.startsWith('all-recipes-summary') && !artifact.expired);
              if (matches.length) {
                selected = { runId: run.id, artifactCount: matches.length, runAttempt: run.run_attempt };
                break;
              }
            }

            if (!selected) {
              core.notice('No completed all-recipes run with unexpired summary artifacts was found.');
              core.setOutput('run_id', '');
              return;
            }

            core.info(`Using ${selected.artifactCount} all-recipes summary artifact(s) from run ${selected.runId} (attempt ${selected.runAttempt}).`);
            core.setOutput('run_id', String(selected.runId));

      - name: Download latest all-recipes artifacts
        if: steps.latest-summary.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: all-recipes-*
          merge-multiple: false
          path: .cache/all-recipes-summary
          run-id: ${{ steps.latest-summary.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dashboard data from recipe manifest
        run: |
          set -euo pipefail
          args=()
          shopt -s nullglob
          for summary in .cache/all-recipes-summary/all-recipes-summary*/summary.json; do
            args+=(--summary-json "$summary")
          done
          if [[ -s .cache/all-recipes-summary/all-recipes-versions/analysis3-versions.json ]]; then
            args+=(--environments-json .cache/all-recipes-summary/all-recipes-versions/analysis3-versions.json)
          fi
          python3 scripts/build_dashboard_data.py "${args[@]}"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
